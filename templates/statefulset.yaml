apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "akash-provider-paladin.fullname" . }}
  annotations:
    buildID: {{ .Values.buildID | quote }}
  namespace: {{ .Values.namespace | default "akash-services" }}
  labels:
    app: {{ include "akash-provider-paladin.name" . }}
spec:
  serviceName: {{ include "akash-provider-paladin.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "akash-provider-paladin.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "akash-provider-paladin.name" . }}
    spec:
      terminationGracePeriodSeconds: 0
      serviceAccountName: {{ include "akash-provider-paladin.fullname" . }}-paladin

      # Affinity rules
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{ .Values.birthNode }}

      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
        - name: {{ include "akash-provider-paladin.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Akash Provider Paladin v2.5.0"
              # apt won't work not sure how best to solve it
              # since it's not needed, I've left it as is...

              {{ .Values.scriptToRun }}
          resources:
            requests:
              cpu: "50m"
              memory: "64M"
            limits:
              cpu: "50m"
              memory: "64M"
          volumeMounts:
            - name: script-volume
              mountPath: /etc/scripts
              readOnly: true
            - name: host-tmp
              mountPath: /host/tmp
              readOnly: false
      volumes:
        - name: script-volume
          configMap:
            name: akash-provider-paladin-script
            defaultMode: 0755
        - name: host-tmp
          hostPath:
            path: /tmp
            type: Directory
